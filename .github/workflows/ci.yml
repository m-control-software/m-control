name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: yarn verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      # Every check lives in scripts/verify.mjs so CI and `yarn verify` cannot
      # drift apart. Add a check there, not here.
      - name: Verify
        run: node scripts/verify.mjs
