name: Copilot Setup Steps

# Prepares the GitHub Copilot cloud agent's environment before it starts work,
# so it can run `yarn verify` like CI does instead of discovering setup by
# trial and error. Runs as a normal workflow when this file changes, and can
# be started by hand from the Actions tab.
#
# Toolchain pins come from the same files CI uses (.nvmrc, .python-version,
# linters.json); test/agent-config.test.ts fails if they drift apart.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Copilot only picks up a job with exactly this name.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # mctl and the typecheck compile against core's dist/.
      - name: Build core
        run: yarn workspace @m-control/core build

      # ruff and PSScriptAnalyzer, so every `yarn verify` step can run.
      - name: Setup linters
        run: node scripts/setup-linters.mjs
